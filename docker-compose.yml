services:
  database:
    container_name: ebookshelf-database
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: ebookshelf-backend
    build: ./backend
    image: ebookshelf-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - MONGODB_URL=mongodb://database:27017/ebookshelf
      - JWT_SECRET=a856a06214afa7b104c4ace59e969f793b8d59529aab6c1414a1387b35c5383c
      - PORT=3000
    depends_on:
      database:
        condition: service_healthy

  nginx:
    container_name: ebookshelf-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server

  client:
    container_name: ebookshelf-frontend
    build: ./frontend
    image: ebookshelf-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - API_PROXY_TARGET=http://nginx:80
    depends_on:
      - nginx
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo-data:
