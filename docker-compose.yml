services:
  database:
    container_name: ebookshelf-database
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: ebookshelf-backend
    build: ./backend
    image: ebookshelf-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  client:
    container_name: ebookshelf-frontend
    build: ./frontend
    image: ebookshelf-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - API_PROXY_TARGET=http://server:3000
    depends_on:
      - server
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo-data:
